[project]
name = "oitg"
dynamic = ["version"]
description = "Oxford Ion-Trap Group routines"
authors = [{ name = "Oxford Ion Trap Quantum Computing Group" }]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "h5py>=3.10.0",
    "numpy>=1.24.2",
    "scipy>=1.11.4",
    "statsmodels>=0.14.0",
]

[project.scripts]
oitg_fetch = "oitg.frontend.oitg_fetch:main"
oitg_index_rids = "oitg.frontend.oitg_index_rids:main"

[dependency-groups]
dev = [
    "poethepoet>=0.22.1",
    "ruff>=0.14.11",
    "sphinx-rtd-theme>=1.3.0",
    "sphinx>=7.2.6",
    "toml>=0.10.2",
]

# Only needed for oitg.circuits.visualisation, which still targets the pre-1.0 Qiskit
# APIs (qiskit.qasm, converters.ast_to_dag).
qiskit = ["qiskit>=0.45.1,<0.46"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.poe.tasks]
docs = "make -C $POE_ROOT/docs html"

_fmt-imports = "ruff check --select I --fix oitg test -q"
_fmt = "ruff format oitg test"
fmt.sequence = ["_fmt-imports", "_fmt"]

_fmt-test-imports = "ruff check --select I oitg test -q"
_fmt-test = "ruff format --check oitg test"
fmt-test.sequence = ["_fmt-test-imports", "_fmt-test"]

lint = "ruff check oitg test"
test = "python -m unittest discover -t . -v test"
