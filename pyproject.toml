[project]
name = "oitg"
version = "0.1"
description = "Oxford Ion-Trap Group routines"
authors = [{name = "Oxford Ion Trap Quantum Computing Group"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "statsmodels>=0.14.0",
    "scipy>=1.11.4",
    "numpy>=1.24.2",
    "h5py>=3.10.0",
]

[dependency-groups]
qiskit = ["qiskit>=0.45.1"]
dev = [
    "poethepoet>=0.22.1",
    "toml>=0.10.2",
    "sphinx>=7.2.6",
    "sphinx-rtd-theme>=1.3.0",
    "ruff>=0.14.11",
]

[project.scripts]
oitg_fetch = "oitg.frontend.oitg_fetch:main"
oitg_index_rids = "oitg.frontend.oitg_index_rids:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.poe.tasks]
fmt = "ruff format src test"
fmt-test = "ruff format --check src test"
lint = "ruff check src test"
test = "python -m unittest discover -t . -v test"
